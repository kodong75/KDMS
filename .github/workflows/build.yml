name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 단위 시험 + 라이선스 검사(허용 목록 밖·정보 없음이면 실패) + SBOM. DB 가 필요한 시험(-Pintegration)은 Mac 에서
      - run: ./mvnw -B -ntp package
