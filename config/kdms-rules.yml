# 작업별 변환 규칙. jar 안의 기본 규칙(src/main/resources/kdms-rules.yml) 위에 여기 적은 키만 덮어쓴다.
# 쓰려면 config/kdms.yml 에 rules: config/kdms-rules.yml (config/kdms.example.yml 은 이미 그렇게 되어 있다)
# 키와 허용 값은 기본 규칙 파일의 주석을 본다. 알 수 없는 키·값은 실행 전에 오류로 멈춘다.
#
# 이 파일은 시험 원천 KDMS_MOCK(KIS MIG_MOCK 사본)용이다. 근거: docs/schema-conversion.md
version: 1

tables:
  # 계산 컬럼(B12): T-SQL 식을 PG 식으로 직접 옮긴다. GENERATED ALWAYS AS (…) STORED, 적재·반영에서 뺀다.
  # 원문 (CASE RTRIM(rating_cd) WHEN 'AAA' THEN 1 … ELSE 99 END) 은 CI 콜레이션 비교라 'aa+' 도 2 → upper() 로 맞춘다
  dbo.rating:
    columns:
      rating_rank:
        generated: >-
          CASE upper(rtrim(rating_cd)) WHEN 'AAA' THEN 1 WHEN 'AA+' THEN 2 WHEN 'AA' THEN 3 WHEN 'AA-' THEN 4
          WHEN 'A+' THEN 5 WHEN 'A' THEN 6 WHEN 'A-' THEN 7 WHEN 'BBB+' THEN 8 WHEN 'BBB' THEN 9 WHEN 'BBB-' THEN 10
          ELSE 99 END
  # 원문: CASE WHEN CHARINDEX('.', file_nm) > 0 THEN LOWER(RIGHT(file_nm, CHARINDEX('.', REVERSE(file_nm)) - 1)) END
  # (마지막 '.' 뒤 문자열 소문자). KIS sql/40_appcompat/20_pg_objects.sql 과 같은 식
  dbo.research_doc:
    columns:
      file_ext:
        generated: >-
          CASE WHEN strpos(file_nm, '.') > 0 THEN lower(substring(file_nm FROM '\.([^.]*)$')) END

  # NUL 문자(A02, T-L09): KIS 가 NUL 을 심은 행이 1건 있다(issuer_cd 900005). 기본 text.nul_char: fail 이면 적재가 그 구간에서 멈춘다.
  # 값을 조용히 잃지 않도록 strip(지움) 대신 replace(U+FFFD '�' 로 바꿈)로 정한다: 대상에서 바뀐 자리를 찾을 수 있다(docs/load-verify.md §4).
  # 검증은 원천 쪽에도 같은 치환을 적용해 비교한다. 다른 컬럼은 기본값 fail 그대로(새 NUL 이 생기면 멈춰서 알린다).
  dbo.issuer:
    columns:
      issuer_nm: { nul_char: replace }

# 예: 코드성 컬럼만 끝 공백 제거(B02·B04)
#   dbo.rating:
#     columns:
#       rating_cd: { trailing_space: rtrim }
