# KDMS 변환 규칙 기본값 (jar 에 들어간다). plan.md §5
# 작업별 규칙 파일(config/kdms.yml 의 rules:)은 이 파일 위에 같은 키를 덮어쓴다.
# 매핑·정규화 근거: KIS:docs/normalization.md §1, KIS:docs/datatype-pitfalls.md, KIS:docs/issues.md(A·B 항목)
# 규칙이 값을 바꾸면(rtrim·upper·센티널→NULL 등) 검증도 같은 규칙으로 원천을 정규화한다(KIS normalization §0).
#
# types.<원천 타입>.to 의 자리표시:
#   {n} 문자 수(nvarchar 는 바이트/2), {p} 정밀도, {s} 스케일
#   max_precision 이 있으면 {p} 를 그 값으로 줄이고 round 로 반올림 방식을 정한다
#   max: (max) 길이일 때 쓸 대상 타입
# 여기 없는 원천 타입(sql_variant, hierarchyid, geography, geometry 등)은 kdms plan 이 "규칙 없음" 오류로 멈춘다.
version: 1

types:
  bigint:           { to: bigint }
  int:              { to: integer }
  smallint:         { to: smallint }
  tinyint:          { to: smallint, check: "BETWEEN 0 AND 255" }
  bit:              { to: boolean }                                  # A07. 앱 SQL 의 "= 1" 이 많으면 smallint 로
  decimal:          { to: "numeric({p},{s})" }
  numeric:          { to: "numeric({p},{s})" }
  money:            { to: "numeric(19,4)" }                          # A04
  smallmoney:       { to: "numeric(10,4)" }
  float:            { to: "double precision" }
  real:             { to: real }
  date:             { to: date }
  time:             { to: "time({p})", max_precision: 6, round: half_up }
  datetime:         { to: "timestamp(3)" }                           # A05: .997 등 3.33ms 값 그대로
  smalldatetime:    { to: "timestamp(0)" }
  datetime2:        { to: "timestamp({p})", max_precision: 6, round: half_up }   # A06: 7자리 → 6자리 반올림
  datetimeoffset:   { to: "timestamptz({p})", max_precision: 6, round: half_up, warn: "오프셋 정보는 버려지고 UTC 시각으로 저장된다" }
  char:             { to: "char({n})" }                              # A10: 채움 공백은 검증에서 RTRIM
  nchar:            { to: "char({n})" }
  varchar:          { to: "varchar({n})", max: text }                # A03: CP949 → UTF-8, 문자 수 같고 바이트 증가
  nvarchar:         { to: "varchar({n})", max: text }
  sysname:          { to: "varchar(128)" }
  text:             { to: text }
  ntext:            { to: text }
  binary:           { to: bytea }
  varbinary:        { to: bytea }
  image:            { to: bytea }
  uniqueidentifier: { to: uuid, warn: "정렬 순서가 달라진다" }
  rowversion:       { to: bytea, warn: "앱이 낙관적 잠금에 쓰면 별도 설계(값은 이관 시점 값으로 고정)" }   # sys.types 이름은 timestamp
  xml:              { to: xml }

identity:
  to: "generated by default as identity"
  setval: from_ident_current        # A09: 전환 때 IDENT_CURRENT 기준 setval

sequence:
  setval: from_current_value        # B09·B13: sys.sequences.current_value 기준

text:
  trailing_space: keep              # keep | rtrim  (B02·B04. 코드성 컬럼만 rtrim 하려면 tables 에서 개별 지정)
  nul_char: fail                    # fail | strip | replace  (A02: 조용히 잘리는 것을 막는다)
  nul_replacement: "�"         # nul_char: replace 일 때 넣을 문자
  case: keep                        # keep | upper | lower

collation:
  target: "C"                       # C | ko-KR-x-icu | ci  (B01·B06·G08)
  ci_unique: lower_index            # none | lower_index | ci_collation  (B14: CI UNIQUE → UNIQUE (lower(col)))

sentinel_dates:                     # A08
  values: ["1753-01-01", "1900-01-01", "9999-12-31"]
  action: keep                      # keep | null | infinity

identifiers:
  case: lower                       # lower | keep  (lower = 원천 이름을 소문자로만 바꾼다. 63바이트 초과는 map 필수)
  map: {}                           # "dbo.원천테이블": 대상테이블  (컬럼 이름은 tables.<t>.columns.<c>.name)
  schemas: {}                       # 원천스키마: 대상스키마  (예: dbo: mock). 없으면 원천 스키마 이름을 case 규칙대로

computed_columns:
  action: generated_stored          # generated_stored | value_with_warning  (CDC 는 계산 컬럼을 캡처하지 않는다, plan.md §4.4)
                                    # generated_stored: T-SQL 식을 자동으로 옮기지 않는다. 컬럼마다 tables.<t>.columns.<c>.generated 에
                                    #   PG 식을 적어야 kdms plan 이 통과한다(B12). value_with_warning: 일반 컬럼 + 원문 식 COMMENT

defaults:                           # 원천 기본값(DEFAULT 제약) 변환. 상수·NEXT VALUE FOR 는 자동, 함수는 아래 표로
  functions:                        # 인자 없는 함수(소문자) → 대상 식. 표에 없는 식은 kdms plan 이 오류로 멈춘다(tables 에서 default 로 직접 지정)
    getdate:           { to: "LOCALTIMESTAMP", warn: "대상 PG 서버 시간대(timezone)가 원천 Windows 시간대와 같아야 같은 값" }
    sysdatetime:       { to: "LOCALTIMESTAMP", warn: "대상 PG 서버 시간대(timezone)가 원천 Windows 시간대와 같아야 같은 값" }
    current_timestamp: { to: "LOCALTIMESTAMP", warn: "대상 PG 서버 시간대(timezone)가 원천 Windows 시간대와 같아야 같은 값" }
    getutcdate:        { to: "(now() AT TIME ZONE 'UTC')" }
    sysutcdatetime:    { to: "(now() AT TIME ZONE 'UTC')" }
    sysdatetimeoffset: { to: "now()" }
    newid:             { to: "gen_random_uuid()" }
    newsequentialid:   { to: "gen_random_uuid()", warn: "순차 GUID 가 아니라 임의 UUID(정렬·인덱스 지역성이 달라진다)" }
    suser_sname:       { to: "session_user", warn: "원천 로그인 이름 대신 PG 접속 역할 이름이 들어간다" }
    suser_name:        { to: "session_user", warn: "원천 로그인 이름 대신 PG 접속 역할 이름이 들어간다" }
    user_name:         { to: "current_user", warn: "원천 DB 사용자 이름 대신 PG 역할 이름이 들어간다" }
    host_name:         { to: "inet_client_addr()::text", warn: "원천 클라이언트 PC 이름 대신 클라이언트 IP" }
    app_name:          { to: "current_setting('application_name')" }
    db_name:           { to: "current_database()" }

tables: {}                          # 테이블·컬럼 단위 덮어쓰기. 키는 "schema.table"(원천 이름)
  # dbo.some_table:
  #   exclude: false                # true 면 이관에서 뺀다
  #   columns:                      # 키는 원천 컬럼 이름
  #     code_col: { trailing_space: rtrim, case: upper }
  #     some_col: { name: new_name, type: "varchar(30)", default: "none" }   # default: 대상 식 | none
  #     calc_col: { generated: "upper(code_col)" }                           # 계산 컬럼의 PG 식(GENERATED ALWAYS AS … STORED)
  #     calc2:    { computed: value_with_warning }                           # 식 없이 값만 옮긴다
